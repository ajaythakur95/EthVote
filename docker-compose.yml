version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: ethvote-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ethvote
    networks:
      - ethvote-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ethvote-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/ethvote
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - ethvote-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ethvote-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ethvote-net

volumes:
  mongo_data:

networks:
  ethvote-net:
    driver: bridge
